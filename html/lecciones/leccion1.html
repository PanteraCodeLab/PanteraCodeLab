                <h1><strong>lección 1</strong></h1>
                <h2><strong>representación de algoritmos</strong></h2>
                <p>
                    Además de los diagramas de flujo, los algoritmos se pueden representar a modo de
                    pseudocódigo, es decir, instrucciones escritas con lenguaje humano fáciles de entender. Por
                    ejemplo:
                </p>
                <img src="../../imgs/lec1/pseudocodigo.png">
                <p>
                    El pseudocódigo funciona como un acercamiento a escribir código de forma
                    convencional. Existen lenguajes de programación que emplean palabras con instrucciones
                    simples y claras, además de tener una
                    estructura sintáctica que se debe respetar para
                    que el programa funcione.
                </p>
                <p>
                    A su vez, los diagramas de flujo
                    contienen instrucciones a modo de
                    pseudocódigo que describen lo que el algoritmo
                    va a realizar.
                </p>
                <p>
                    A continuación se presentan algunas
                    herramientas que sirven para familiarizarse con
                    el pseudocódigo y la programación en base a
                    bloques o diagramas.
                </p>
                <img src="../../imgs/lec1/diagrama.png">
